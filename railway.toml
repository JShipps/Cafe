# Railway config-as-code. Variables (ADMIN_PASSWORD, TZ, TRUST_PROXY) and the
# /data volume are set on the service itself — see README "Deploy to Railway".
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/info"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
