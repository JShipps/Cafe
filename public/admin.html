<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Staff Dashboard — Hearth &amp; Crumb</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin-body">
  <main class="wrap" style="padding-bottom:64px">
    <section id="login-view" hidden style="max-width:420px;margin:12vh auto 0">
      <form class="card" id="login" novalidate>
        <a class="logo" href="./" style="margin-bottom:20px" id="login-logo"></a>
        <h2>Staff sign in</h2>
        <div class="alert error" id="login-error" role="alert"></div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        </div>
        <button class="btn accent block" type="submit">Sign in</button>
      </form>
    </section>

    <section id="dash-view" hidden>
      <div class="admin-top">
        <a class="logo" href="./" id="dash-logo"></a>
        <div style="display:flex;gap:8px">
          <a class="btn small secondary" href="./" target="_blank">View site</a>
          <button class="btn small secondary" id="logout">Sign out</button>
        </div>
      </div>

      <div class="stat-row" id="stats"></div>

      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="orders">Orders</button>
        <button role="tab" aria-selected="false" data-tab="menu">Menu</button>
        <button role="tab" aria-selected="false" data-tab="messages">Messages</button>
      </div>

      <div data-panel="orders">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap">
          <label class="checkbox"><input type="checkbox" id="show-all"> Show completed &amp; cancelled</label>
          <span class="muted" style="font-size:.85rem">Refreshes every 20 seconds</span>
        </div>
        <div class="order-grid" id="orders"></div>
      </div>

      <div data-panel="menu" hidden>
        <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
          <button class="btn small accent" id="add-item">+ Add item</button>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Item</th><th>Category</th><th>Price</th><th>Available</th><th>Featured</th><th></th></tr></thead>
            <tbody id="menu-rows"></tbody>
          </table>
        </div>
      </div>

      <div data-panel="messages" hidden>
        <div class="card" style="padding:0;overflow:hidden" id="messages"></div>
      </div>
    </section>
  </main>

  <dialog id="item-dialog">
    <form id="item-form" method="dialog" novalidate>
      <h2 id="item-dialog-title">Edit item</h2>
      <div class="alert error" id="item-error" role="alert"></div>
      <div class="field"><label for="i-name">Name</label><input id="i-name" name="name" required maxlength="80"></div>
      <div class="field"><label for="i-desc">Description</label><textarea id="i-desc" name="description" maxlength="300" rows="2" style="min-height:70px"></textarea></div>
      <div class="row">
        <div class="field"><label for="i-price">Price ($)</label><input id="i-price" name="price" type="number" min="0" step="0.05" required></div>
        <div class="field"><label for="i-cat">Category</label><select id="i-cat" name="categoryId"></select></div>
      </div>
      <div class="field"><label for="i-tags">Tags</label><input id="i-tags" name="tags" maxlength="100" placeholder="vegan, seasonal"><span class="hint">Comma-separated. vegan, gluten-free and seasonal get coloured badges.</span></div>
      <div style="display:flex;gap:20px;margin-bottom:20px">
        <label class="checkbox"><input type="checkbox" name="available" checked> Available</label>
        <label class="checkbox"><input type="checkbox" name="featured"> Featured on home page</label>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn secondary small" type="button" id="item-cancel">Cancel</button>
        <button class="btn accent small" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
